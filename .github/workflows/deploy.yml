# Deploy Workflow
# Runs on approved release - host pulls signed release, runs preflight/backup/migration/apply/smoke

name: Deploy

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - rollback
      release_tag:
        description: 'Release tag to deploy or rollback to (e.g., v1.0.0)'
        required: true
        type: string
      skip_backup:
        description: 'Skip pre-deployment backup (NOT RECOMMENDED)'
        required: false
        default: false
        type: boolean
      confirm:
        description: 'Type "DEPLOY" or "ROLLBACK" to confirm'
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Release
    if: github.event.inputs.operation == 'deploy' || github.event.inputs.operation == ''
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      OCI_REGION: ${{ vars.OCI_REGION }}
      OCI_OBJECT_STORAGE_NAMESPACE: ${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}
      OCI_RELEASE_BUCKET: ${{ vars.OCI_RELEASE_BUCKET }}
    steps:
      - name: Verify Confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "Confirmation must be 'DEPLOY'"
            exit 1
          fi

      - name: Configure OCI OIDC
        uses: oracle/oci-cli-action@v1
        with:
          version: "latest"
          oci_region: ${{ env.OCI_REGION }}
          auth_type: "workload_identity"
          workload_identity_provider: ${{ vars.OCI_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Trigger Deployment on Gateway VM
        id: deploy
        run: |
          INSTANCE_OCID="${{ vars.GATEWAY_INSTANCE_OCID }}"

          if [ -z "$INSTANCE_OCID" ]; then
            echo "GATEWAY_INSTANCE_OCID not configured"
            exit 1
          fi

          SKIP_BACKUP_FLAG=""
          if [ "${{ github.event.inputs.skip_backup }}" == "true" ]; then
            SKIP_BACKUP_FLAG="--skip-backup"
          fi

          echo "Triggering deployment on instance: $INSTANCE_OCID"
          echo "Release: ${{ github.event.inputs.release_tag }}"

          DEPLOY_CMD="sudo bash -c 'set -euo pipefail
          RELEASE_TAG=\"${{ github.event.inputs.release_tag }}\"
          RELEASE_DIR=\"/opt/llm-gateway/releases/\$RELEASE_TAG\"
          CURRENT_DIR=\"/opt/llm-gateway/current\"
          mkdir -p \"\$RELEASE_DIR/caddy\" \"\$RELEASE_DIR/config\" /opt/llm-gateway/compose
          oci os object get --namespace \"${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}\" --bucket-name \"${{ vars.OCI_RELEASE_BUCKET }}\" --name \"\$RELEASE_TAG/manifest.json\" --auth instance_principal --file \"\$RELEASE_DIR/manifest.json\"
          oci os object get --namespace \"${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}\" --bucket-name \"${{ vars.OCI_RELEASE_BUCKET }}\" --name \"\$RELEASE_TAG/compose.yaml\" --auth instance_principal --file \"\$RELEASE_DIR/compose.yaml\"
          oci os object get --namespace \"${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}\" --bucket-name \"${{ vars.OCI_RELEASE_BUCKET }}\" --name \"\$RELEASE_TAG/compose.prod.yaml\" --auth instance_principal --file \"\$RELEASE_DIR/compose.prod.yaml\"
          oci os object get --namespace \"${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}\" --bucket-name \"${{ vars.OCI_RELEASE_BUCKET }}\" --name \"\$RELEASE_TAG/Caddyfile\" --auth instance_principal --file \"\$RELEASE_DIR/caddy/Caddyfile\"
          oci os object get --namespace \"${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}\" --bucket-name \"${{ vars.OCI_RELEASE_BUCKET }}\" --name \"\$RELEASE_TAG/litellm.yaml\" --auth instance_principal --file \"\$RELEASE_DIR/config/litellm.yaml\"
          oci os object get --namespace \"${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}\" --bucket-name \"${{ vars.OCI_RELEASE_BUCKET }}\" --name \"\$RELEASE_TAG/model-catalog.yaml\" --auth instance_principal --file \"\$RELEASE_DIR/config/model-catalog.yaml\"
          cp \"\$RELEASE_DIR\"/compose*.yaml /opt/llm-gateway/compose/
          cp \"\$RELEASE_DIR\"/caddy/Caddyfile /opt/llm-gateway/caddy/
          cp \"\$RELEASE_DIR\"/config/*.yaml /opt/llm-gateway/config/
          ln -sfn \"\$RELEASE_DIR\" \"\$CURRENT_DIR\"
          cd /opt/llm-gateway/compose
          docker compose -f compose.yaml -f compose.prod.yaml pull --quiet
          systemctl restart llm-gateway.service'"

          # Use OCI Instance Agent to run deployment directly on VM
          oci compute-instance-agent command create \
            --instance-id "$INSTANCE_OCID" \
            --command "$DEPLOY_CMD" \
            --auth instance_principal \
            --wait-for-state SUCCEEDED --wait-interval-seconds 30

      - name: Wait for deployment to stabilize
        run: |
          sleep 60

      - name: Run smoke tests against deployed gateway
        id: smoke
        run: |
          GATEWAY_URL="https://${{ vars.GATEWAY_DNS_DOMAIN }}"
          TEST_KEY="${{ secrets.SMOKE_TEST_KEY }}"

          echo "Running smoke tests against $GATEWAY_URL"

          # Test 1: Health check (public)
          echo "Test 1: Health check"
          for i in {1..20}; do
            if curl -sf --max-time 10 "$GATEWAY_URL/health" > /dev/null; then
              echo "  ✓ Health check passed"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "  ✗ Health check failed after 20 attempts"
              exit 1
            fi
            sleep 15
          done

          # Test 2: Status check
          echo "Test 2: Status check"
          if curl -sf --max-time 10 "$GATEWAY_URL/status" > /dev/null; then
            echo "  ✓ Status check passed"
          else
            echo "  ✗ Status check failed"
            exit 1
          fi

          # Test 3: Models list (requires auth)
          if [ -n "$TEST_KEY" ]; then
            echo "Test 3: Models list"
            if curl -sf --max-time 10 -H "Authorization: Bearer $TEST_KEY" "$GATEWAY_URL/v1/models" > /dev/null; then
              echo "  ✓ Models list passed"
            else
              echo "  ✗ Models list failed"
              exit 1
            fi

            # Test 4: Chat completions (expect 5xx without provider but not 401/403)
            echo "Test 4: Chat completions endpoint"
            RESPONSE=$(curl -s -w '\n%{http_code}' -X POST "$GATEWAY_URL/v1/chat/completions" \
              -H "Authorization: Bearer $TEST_KEY" \
              -H "Content-Type: application/json" \
              -d '{"model": "general-fast", "messages": [{"role": "user", "content": "test"}], "max_tokens": 5}' 2>/dev/null || true)
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            if [[ "$HTTP_CODE" == "200" || "$HTTP_CODE" == "500" || "$HTTP_CODE" == "502" || "$HTTP_CODE" == "503" ]]; then
              echo "  ✓ Chat endpoint reachable (HTTP $HTTP_CODE)"
            else
              echo "  ✗ Chat endpoint unexpected response (HTTP $HTTP_CODE)"
              exit 1
            fi

            # Test 5: Embeddings endpoint
            echo "Test 5: Embeddings endpoint"
            RESPONSE=$(curl -s -w '\n%{http_code}' -X POST "$GATEWAY_URL/v1/embeddings" \
              -H "Authorization: Bearer $TEST_KEY" \
              -H "Content-Type: application/json" \
              -d '{"model": "rag-embedding", "input": ["test"]}' 2>/dev/null || true)
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            if [[ "$HTTP_CODE" == "200" || "$HTTP_CODE" == "500" || "$HTTP_CODE" == "502" || "$HTTP_CODE" == "503" ]]; then
              echo "  ✓ Embeddings endpoint reachable (HTTP $HTTP_CODE)"
            else
              echo "  ✗ Embeddings endpoint unexpected response (HTTP $HTTP_CODE)"
              exit 1
            fi

            # Test 6: Management routes blocked
            echo "Test 6: Management routes blocked"
            for endpoint in "/ui" "/key/generate" "/team/list" "/config" "/spend/logs" "/metrics" "/health/readiness"; do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$GATEWAY_URL$endpoint" 2>/dev/null || echo "000")
              if [ "$HTTP_CODE" == "404" ]; then
                echo "  ✓ $endpoint blocked (404)"
              else
                echo "  ✗ $endpoint accessible (HTTP $HTTP_CODE)"
                exit 1
              fi
            done
          else
            echo "⚠ Skipping authenticated tests (no SMOKE_TEST_KEY configured)"
          fi

          echo "All smoke tests passed!"

      - name: Notify Success
        uses: actions/github-script@v9
        if: success()
        with:
          script: |
            const body = `## ✅ Release Deployed Successfully\n\n**Release:** ${{ github.event.inputs.release_tag }}\n**Deployed by:** ${{ github.actor }}\n**Time:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")\n\nGateway is running the new release. All smoke tests passed.`;
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[DEPLOY] Release deployed - ${{ github.event.inputs.release_tag }}',
              body: body,
              labels: ['deployment', 'success']
            });

      - name: Notify Failure
        uses: actions/github-script@v9
        if: failure()
        with:
          script: |
            const body = `## ❌ Deployment Failed\n\n**Release:** ${{ github.event.inputs.release_tag }}\n**Failed by:** ${{ github.actor }}\n**Time:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")\n\nCheck workflow logs and gateway VM logs for details. Consider rollback.`;
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[DEPLOY-FAILED] Deployment failed - ${{ github.event.inputs.release_tag }}',
              body: body,
              labels: ['deployment', 'failed']
            });

  rollback:
    name: Rollback (Manual)
    if: github.event.inputs.operation == 'rollback'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Verify Confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "ROLLBACK" ]; then
            echo "Confirmation must be 'ROLLBACK'"
            exit 1
          fi

      - name: Configure OCI OIDC
        uses: oracle/oci-cli-action@v1
        with:
          version: "latest"
          oci_region: ${{ vars.OCI_REGION }}
          auth_type: "workload_identity"
          workload_identity_provider: ${{ vars.OCI_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Trigger Rollback on Gateway VM
        run: |
          INSTANCE_OCID="${{ vars.GATEWAY_INSTANCE_OCID }}"

          if [ -z "$INSTANCE_OCID" ]; then
            echo "GATEWAY_INSTANCE_OCID not configured"
            exit 1
          fi

          ROLLBACK_CMD="sudo bash -c 'set -euo pipefail
          RELEASE_TAG=\"${{ github.event.inputs.release_tag }}\"
          RELEASE_DIR=\"/opt/llm-gateway/releases/\$RELEASE_TAG\"
          if [ ! -d \"\$RELEASE_DIR\" ]; then
            echo \"Release directory \$RELEASE_DIR not found for rollback\" >&2
            exit 1
          fi
          cp \"\$RELEASE_DIR\"/compose*.yaml /opt/llm-gateway/compose/
          cp \"\$RELEASE_DIR\"/caddy/Caddyfile /opt/llm-gateway/caddy/
          cp \"\$RELEASE_DIR\"/config/*.yaml /opt/llm-gateway/config/
          ln -sfn \"\$RELEASE_DIR\" /opt/llm-gateway/current
          cd /opt/llm-gateway/compose
          docker compose -f compose.yaml -f compose.prod.yaml up -d --remove-orphans
          systemctl restart llm-gateway.service'"

          oci compute-instance-agent command create \
            --instance-id "$INSTANCE_OCID" \
            --command "$ROLLBACK_CMD" \
            --auth instance_principal \
            --wait-for-state SUCCEEDED --wait-interval-seconds 30

      - name: Verify Rollback
        run: |
          sleep 60
          GATEWAY_URL="https://${{ vars.GATEWAY_DNS_DOMAIN }}"

          for i in {1..20}; do
            if curl -sf --max-time 10 "$GATEWAY_URL/health" > /dev/null; then
              echo "Gateway health check passed after rollback"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "Health check failed after rollback"
              exit 1
            fi
            sleep 15
          done
          echo "Rollback verified successfully"
