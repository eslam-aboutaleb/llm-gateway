# Centralized CI Quality Pipeline
# Calls shared reusable workflows in eslam-aboutaleb/ci-workflows

name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  quality:
    uses: eslam-aboutaleb/ci-workflows/.github/workflows/ci.yml@0cf8be0e156ae27fdc3efae86ba665932013a2c9
    permissions:
      contents: read
      actions: read
      security-events: write
      pull-requests: read
