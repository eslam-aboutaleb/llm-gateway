# Centralized CI Quality Pipeline
# Calls shared reusable workflows in eslam-aboutaleb/ci-workflows

name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  quality:
    uses: eslam-aboutaleb/ci-workflows/.github/workflows/ci.yml@68615e1c52d02f621ea67dec67386179eeeac35e
    permissions:
      contents: read
      actions: read
      security-events: write
      pull-requests: read
