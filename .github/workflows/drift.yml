# Drift Detection Workflow
# Runs daily - full-stack refresh/full plan to detect drift

name: Drift Detection

on:
  schedule:
    - cron: '0 6 * * *'  # Daily 6 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: drift-detection
  cancel-in-progress: true

jobs:
  drift:
    name: Infrastructure Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OCI_REGION: ${{ vars.OCI_REGION }}
      OCI_TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}
      OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
      OCI_USER_OCID: ${{ vars.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ vars.OCI_FINGERPRINT }}
      OCI_SSH_PUBLIC_KEY: ${{ vars.OCI_SSH_PUBLIC_KEY }}
      OCI_OBJECT_STORAGE_NAMESPACE: ${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}
      TF_VAR_oci_region: ${{ vars.OCI_REGION }}
      TF_VAR_oci_tenancy_ocid: ${{ vars.OCI_TENANCY_OCID }}
      TF_VAR_oci_compartment_ocid: ${{ vars.OCI_COMPARTMENT_OCID }}
      TF_VAR_oci_ssh_public_key: ${{ vars.OCI_SSH_PUBLIC_KEY }}
      TF_VAR_github_repository: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.x"
          terraform_wrapper: false

      - name: Setup Terramate
        uses: terramate-io/terramate-action@v3
        with:
          version: "latest"

      - name: Configure OCI Credentials
        env:
          OCI_API_KEY: ${{ secrets.OCI_API_KEY }}
        run: |
          pip install --quiet oci-cli
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_API_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${OCI_USER_OCID}
          fingerprint=${OCI_FINGERPRINT}
          tenancy=${OCI_TENANCY_OCID}
          region=${OCI_REGION}
          key_file=$HOME/.oci/oci_api_key.pem
          EOF
          chmod 600 ~/.oci/config

          NS="${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}"
          if [ -z "$NS" ]; then
            NS=$(oci os ns get --query 'data' --raw-output)
          fi
          {
            echo "OCI_OBJECT_STORAGE_NAMESPACE=$NS"
            echo "TF_VAR_oci_object_storage_namespace=$NS"
            echo "TFSTATE_BUCKET=tfstate-${NS}"
          } >> "$GITHUB_ENV"

      - name: Terramate Generate
        run: terramate generate

      - name: Terraform Init
        run: |
          cd infrastructure/stacks/oci/production
          terraform init -input=false \
            -backend-config="bucket=${TFSTATE_BUCKET}" \
            -backend-config="region=${OCI_REGION}" \
            -backend-config="namespace=${OCI_OBJECT_STORAGE_NAMESPACE}"

      - name: Terraform Refresh & Plan
        id: drift
        run: |
          cd infrastructure/stacks/oci/production
          DRIFT_CODE=0
          terraform plan -input=false -detailed-exitcode -out=drift.tfplan || DRIFT_CODE=$?
          if [ "${DRIFT_CODE}" == "2" ]; then
            echo "DRIFT_DETECTED=true" >> "$GITHUB_ENV"
            terraform show -no-color drift.tfplan > drift-summary.txt
          elif [ "${DRIFT_CODE}" == "1" ]; then
            echo "Terraform error during plan"
            exit 1
          else
            echo "DRIFT_DETECTED=false" >> "$GITHUB_ENV"
          fi

      - name: Report Drift
        if: env.DRIFT_DETECTED == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const drift = fs.readFileSync('infrastructure/stacks/oci/production/drift-summary.txt', 'utf8');
            const body = `## ⚠️ Infrastructure Drift Detected\n\n**Stack:** oci-production\n\n\`\`\`\n${drift}\n\`\`\`\n\nPlease review and apply necessary changes via the \`infra-apply\` workflow.`;
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[DRIFT] Infrastructure drift detected',
              body: body,
              labels: ['drift', 'infrastructure', 'automated']
            });

      - name: No Drift
        if: env.DRIFT_DETECTED == 'false'
        run: |
          echo "No drift detected - infrastructure matches desired state"
