# Admin Operations Workflow
# Replaces: admin-create-team.sh, admin-issue-key.sh, admin-revoke-key.sh
# Manual dispatch for administrator operations via SSH tunnel

name: Admin Operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Admin operation to perform'
        required: true
        type: choice
        options:
          - create-team
          - issue-key
          - revoke-key
          - list-keys
          - list-teams
      # create-team inputs
      team_alias:
        description: 'Team alias (for create-team)'
        required: false
        type: string
      team_name:
        description: 'Team display name (for create-team)'
        required: false
        type: string
      budget:
        description: 'Monthly budget in USD (for create-team)'
        required: false
        type: string
        default: '100'
      budget_duration:
        description: 'Budget reset window (for create-team)'
        required: false
        type: string
        default: '30d'
      rpm_limit:
        description: 'Requests per minute limit (for create-team)'
        required: false
        type: string
        default: '100'
      tpm_limit:
        description: 'Tokens per minute limit (for create-team)'
        required: false
        type: string
        default: '10000'
      # issue-key inputs
      key_alias:
        description: 'Key alias (for issue-key)'
        required: false
        type: string
        default: ''
      user_id:
        description: 'User ID (for issue-key)'
        required: false
        type: string
        default: ''
      team_id:
        description: 'Team ID (optional, for issue-key)'
        required: false
        type: string
        default: ''
      models:
        description: 'Comma-separated model aliases (for issue-key)'
        required: false
        type: string
        default: 'general-fast,general-reasoning,rag-embedding,structured-output,agent-tools'
      key_budget:
        description: 'Monthly budget in USD (for issue-key)'
        required: false
        type: string
        default: '50'
      key_budget_duration:
        description: 'Budget reset window (for issue-key)'
        required: false
        type: string
        default: '90d'
      duration:
        description: 'Key expiry (for issue-key)'
        required: false
        type: string
        default: '90d'
      key_rpm:
        description: 'Requests per minute (for issue-key)'
        required: false
        type: string
        default: '60'
      key_tpm:
        description: 'Tokens per minute (for issue-key)'
        required: false
        type: string
        default: '50000'
      parallel:
        description: 'Max parallel requests (for issue-key)'
        required: false
        type: string
        default: '2'
      metadata:
        description: 'JSON metadata (for issue-key)'
        required: false
        type: string
        default: '{}'
      # revoke-key inputs
      key_identifier:
        description: 'Key alias or ID to revoke (for revoke-key)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  admin-operations:
    name: Admin Operation
    runs-on: ubuntu-latest
    if: github.actor == 'eslam-aboutaleb'
    timeout-minutes: 15
    env:
      LITELLM_URL: http://localhost:4000
      LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
    steps:
      - name: Verify Authorized Operator
        run: |
          if [ "${{ github.actor }}" != "eslam-aboutaleb" ]; then
            echo "::error::Unauthorized: Actor '${{ github.actor }}' is not permitted to run admin operations. Only 'eslam-aboutaleb' is authorized."
            exit 1
          fi
          echo "✓ Operator '${{ github.actor }}' is verified and authorized."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate operation inputs
        run: |
          case "${{ github.event.inputs.operation }}" in
            create-team)
              if [[ -z "${{ github.event.inputs.team_alias }}" || -z "${{ github.event.inputs.team_name }}" ]]; then
                echo "team_alias and team_name required for create-team"
                exit 1
              fi
              ;;
            issue-key)
              if [[ -z "${{ github.event.inputs.key_alias }}" || -z "${{ github.event.inputs.user_id }}" || -z "${{ github.event.inputs.models }}" ]]; then
                echo "key_alias, user_id, and models required for issue-key"
                exit 1
              fi
              ;;
            revoke-key)
              if [[ -z "${{ github.event.inputs.key_identifier }}" ]]; then
                echo "key_identifier required for revoke-key"
                exit 1
              fi
              ;;
          esac

      - name: Execute Admin Operation via SSH
        env:
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          GATEWAY_PUBLIC_IP: ${{ vars.GATEWAY_PUBLIC_IP || '82.70.210.36' }}
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$GATEWAY_PUBLIC_IP" >> ~/.ssh/known_hosts 2>/dev/null

          case "${{ github.event.inputs.operation }}" in
            issue-key)
              MODELS_JSON=$(echo "${{ github.event.inputs.models }}" | jq -R 'split(",") | map(gsub("^ +| +$";""))')
              PAYLOAD=$(jq -n \
                --arg ka "${{ github.event.inputs.key_alias }}" \
                --arg uid "${{ github.event.inputs.user_id }}" \
                --arg tid "${{ github.event.inputs.team_id }}" \
                --arg dur "${{ github.event.inputs.duration || '90d' }}" \
                --arg bdur "${{ github.event.inputs.key_budget_duration || github.event.inputs.budget_duration || '90d' }}" \
                --argjson models "$MODELS_JSON" \
                --argjson budget "${{ github.event.inputs.key_budget || 50 }}" \
                --argjson rpm "${{ github.event.inputs.key_rpm || 60 }}" \
                --argjson tpm "${{ github.event.inputs.key_tpm || 50000 }}" \
                --argjson parallel "${{ github.event.inputs.parallel || 2 }}" \
                '{
                  key_alias: $ka,
                  user_id: $uid,
                  models: $models,
                  max_budget: $budget,
                  budget_duration: $bdur,
                  duration: $dur,
                  rpm_limit: $rpm,
                  tpm_limit: $tpm,
                  max_parallel_requests: $parallel
                } + (if $tid != "" then {team_id: $tid} else {} end)')

              echo "Sending key generation request to LiteLLM..."
              RESPONSE=$(ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no ubuntu@"$GATEWAY_PUBLIC_IP" \
                "curl -s -X POST http://127.0.0.1:4000/key/generate \
                 -H \"Authorization: Bearer $LITELLM_MASTER_KEY\" \
                 -H \"Content-Type: application/json\" \
                 -d '$PAYLOAD'")

              KEY=$(echo "$RESPONSE" | jq -r '.key // empty')
              if [ -n "$KEY" ]; then
                echo "=========================================================="
                echo "✓ VIRTUAL KEY ISSUED SUCCESSFULLY"
                echo "=========================================================="
                echo "User ID:    ${{ github.event.inputs.user_id }}"
                echo "Key Alias:  ${{ github.event.inputs.key_alias }}"
                echo "Key Name:   $(echo "$RESPONSE" | jq -r '.key_name // "N/A"')"
                echo "Max Budget: \$${{ github.event.inputs.key_budget || 50 }}"
                echo "Duration:   ${{ github.event.inputs.duration || '90d' }}"
                echo "Models:     ${{ github.event.inputs.models }}"
                echo ""
                echo "VIRTUAL API KEY: $KEY"
                echo "=========================================================="
                echo "⚠️  Deliver this key to the user securely. It will not be shown again."
              else
                echo "✗ Failed to generate key. LiteLLM response:"
                echo "$RESPONSE"
                exit 1
              fi
              ;;

            list-keys)
              ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no ubuntu@"$GATEWAY_PUBLIC_IP" \
                "curl -s -X GET http://127.0.0.1:4000/key/list -H \"Authorization: Bearer $LITELLM_MASTER_KEY\"" | jq .
              ;;

            revoke-key)
              KEY_IDENTIFIER="${{ github.event.inputs.key_identifier }}"
              echo "Revoking key identifier: $KEY_IDENTIFIER..."
              if [[ "$KEY_IDENTIFIER" == sk-* ]]; then
                REVOKE_PAYLOAD=$(jq -n --arg k "$KEY_IDENTIFIER" '{"keys": [$k]}')
                RESPONSE=$(ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no ubuntu@"$GATEWAY_PUBLIC_IP" \
                  "curl -s -X POST http://127.0.0.1:4000/key/delete \
                   -H \"Authorization: Bearer $LITELLM_MASTER_KEY\" \
                   -H \"Content-Type: application/json\" \
                   -d '$REVOKE_PAYLOAD'")
              else
                RESPONSE=$(ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no ubuntu@"$GATEWAY_PUBLIC_IP" \
                  "docker exec llm-gateway-postgres psql -U litellm -d litellm -c \"DELETE FROM \\\"LiteLLM_VerificationToken\\\" WHERE key_alias = '$KEY_IDENTIFIER';\" && docker exec llm-gateway-redis sh -c 'redis-cli -a \"\$REDIS_PASSWORD\" FLUSHALL' 2>/dev/null || true; echo '{\"status\": \"success\", \"deleted_alias\": \"$KEY_IDENTIFIER\"}'")
              fi
              echo "$RESPONSE" | jq .
              if echo "$RESPONSE" | jq -e '.error // .detail' >/dev/null 2>&1; then
                echo "✗ Failed to revoke key."
                exit 1
              fi
              echo "✓ Key revoked successfully."
              ;;

            create-team)
              PAYLOAD=$(jq -n \
                --arg ta "${{ github.event.inputs.team_alias }}" \
                --arg tn "${{ github.event.inputs.team_name }}" \
                --arg dur "${{ github.event.inputs.budget_duration }}" \
                --argjson budget "${{ github.event.inputs.budget }}" \
                --argjson rpm "${{ github.event.inputs.rpm_limit }}" \
                --argjson tpm "${{ github.event.inputs.tpm_limit }}" \
                '{team_alias: $ta, team_name: $tn, max_budget: $budget, budget_duration: $dur, rpm_limit: $rpm, tpm_limit: $tpm}')
              ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no ubuntu@"$GATEWAY_PUBLIC_IP" \
                "curl -s -X POST http://127.0.0.1:4000/team/new -H \"Authorization: Bearer $LITELLM_MASTER_KEY\" -H \"Content-Type: application/json\" -d '$PAYLOAD'" | jq .
              ;;

            list-teams)
              ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no ubuntu@"$GATEWAY_PUBLIC_IP" \
                "curl -s -X GET http://127.0.0.1:4000/team/list -H \"Authorization: Bearer $LITELLM_MASTER_KEY\"" | jq .
              ;;
          esac