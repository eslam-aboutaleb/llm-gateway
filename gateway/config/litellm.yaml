# LiteLLM Proxy Configuration
# This file is managed by Git and deployed via Compose
# NEVER store secrets in this file - use environment variables

general_settings:
  # Master key for admin API (set via LITELLM_MASTER_KEY env var)
  master_key: "os.environ/LITELLM_MASTER_KEY"

  # Salt key for database encryption (set via LITELLM_SALT_KEY env var)
  # CRITICAL: Changing this makes stored credentials unreadable!
  salt_key: "os.environ/LITELLM_SALT_KEY"

  # Database URL (set via DATABASE_URL env var)
  database_url: "os.environ/DATABASE_URL"

  # Redis URL (set via REDIS_URL env var)
  redis_url: "os.environ/REDIS_URL"

  # Disable schema updates on serving containers
  # Migrations run as a separate one-off job (litellm-migrate)
  disable_schema_update: true
  disable_prisma_schema_update: true

  # UI credentials (separate from master key)
  ui_username: "admin"
  ui_password: "os.environ/LITELLM_UI_PASSWORD"

  # Allowed routes for virtual keys (inference only)
  # This is the default for all keys unless overridden
  allowed_routes_for_keys: ["/v1/chat/completions", "/v1/embeddings", "/v1/models"]

  # Request/response logging
  log_level: "INFO"
  request_timeout: 600
  max_request_size_mb: 100

  # Rate limiting (global defaults, can be overridden per key)
  global_rpm_limit: 1000
  global_tpm_limit: 100000

  # Budget defaults
  default_budget_duration: "30d"

  # Caching
  cache_enabled: true
  cache_type: "redis"
  cache_ttl_seconds: 300

  # Fallbacks
  fallback_to_original_model_on_failure: false

  # Telemetry (disabled by default for privacy)
  telemetry_enabled: false

  # Proxy settings
  proxy_server: ""
  no_proxy: "localhost,127.0.0.1,::1"

# Runtime deployment map
# Stable aliases are the public contract. Provider/model entries below are
# replaceable deployments; callers must never use these provider model IDs.
# Keep provider credentials in environment variables only.
model_list:
  # General purpose fast model
  - model_name: "general-fast"
    litellm_params:
      model: "openai/gpt-4o-mini"
      api_key: "os.environ/OPENAI_API_KEY"
      max_tokens: 4096
      temperature: 0.7
    model_info:
      description: "Fast general-purpose model for chat and analysis"
      max_tokens: 128000
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.0000006
      mode: "chat"

  # General purpose reasoning model
  - model_name: "general-reasoning"
    litellm_params:
      model: "openai/gpt-4o"
      api_key: "os.environ/OPENAI_API_KEY"
      max_tokens: 4096
      temperature: 0.3
    model_info:
      description: "Higher capability model for complex reasoning"
      max_tokens: 128000
      input_cost_per_token: 0.0000025
      output_cost_per_token: 0.00001
      mode: "chat"

  # Structured output / function calling
  - model_name: "structured-output"
    litellm_params:
      model: "openai/gpt-4o"
      api_key: "os.environ/OPENAI_API_KEY"
      max_tokens: 4096
      temperature: 0.1
    model_info:
      description: "Optimized for structured output and function calling"
      max_tokens: 128000
      input_cost_per_token: 0.0000025
      output_cost_per_token: 0.00001
      mode: "chat"

  # Agent / tool use
  - model_name: "agent-tools"
    litellm_params:
      model: "openai/gpt-4o"
      api_key: "os.environ/OPENAI_API_KEY"
      max_tokens: 4096
      temperature: 0.2
    model_info:
      description: "Optimized for agent workflows and tool use"
      max_tokens: 128000
      input_cost_per_token: 0.0000025
      output_cost_per_token: 0.00001
      mode: "chat"

  # RAG Embeddings
  - model_name: "rag-embedding"
    litellm_params:
      model: "openai/text-embedding-3-small"
      api_key: "os.environ/OPENAI_API_KEY"
      dimensions: 1536
    model_info:
      description: "Embeddings for RAG and similarity search"
      max_tokens: 8191
      input_cost_per_token: 0.00000002
      output_cost_per_token: 0
      mode: "embedding"

    # Provider switch examples
    #
    # To move an alias, change only its deployment entry and preserve model_name.
    # Vertex AI:
    #   model_name: "general-fast"
    #   litellm_params:
    #     model: "vertex_ai/gemini-2.0-flash"
    #     vertex_project: "os.environ/VERTEX_PROJECT"
    #     vertex_location: "os.environ/VERTEX_LOCATION"
    # Bedrock:
    #   model_name: "general-fast"
    #   litellm_params:
    #     model: "bedrock/anthropic.claude-3-haiku-20240307-v1:0"
    #     aws_region_name: "os.environ/AWS_REGION_NAME"
    #
    # For a live fallback, add the alternate entry with the same model_name and
    # validate capability parity, pricing, timeout, and credential availability.

# Router settings
router_settings:
  # Routing strategy (valid LiteLLM values: simple-shuffle, least-busy, latency-based-routing, usage-based-routing, usage-based-routing-v2)
  routing_strategy: "latency-based-routing"

  # Retry settings
  num_retries: 2
  retry_after: 1
  retry_after_seconds: 1
  retry_on_status_codes: [429, 500, 502, 503, 504]

  # Timeout
  timeout: 600

# Team and user defaults
team_defaults:
  max_budget: 100
  budget_duration: "30d"
  rpm_limit: 100
  tpm_limit: 10000
  max_parallel_requests: 5

user_defaults:
  max_budget: 10
  budget_duration: "30d"
  rpm_limit: 20
  tpm_limit: 2000
  max_parallel_requests: 2

# Key defaults
key_defaults:
  allowed_routes: ["/v1/chat/completions", "/v1/embeddings", "/v1/models"]
  duration: "30d"
  max_budget: 10
  budget_duration: "30d"
  rpm_limit: 20
  tpm_limit: 2000
  max_parallel_requests: 2

# Feature flags
features:
  # Enable/disable specific features
  enable_admin_ui: true
  enable_key_management: true
  enable_team_management: true
  enable_user_management: true
  enable_budget_management: true
  enable_spend_logs: true
  enable_audit_logs: true
  enable_model_management: true

# Custom callbacks (for logging, metrics, etc.)
# NOTE: Only built-in LiteLLM callback names are valid here (e.g. "prometheus", "langfuse").
# Custom Python callback strings ("custom_logging", etc.) require the module to be present
# in the container image. Remove or replace with supported built-in callbacks.
# callbacks:
#   - "prometheus"